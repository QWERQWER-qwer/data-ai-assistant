<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 데이터를 아는 AI 비서</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #1a1f35;
      --panel2: #232a45;
      --line: #313a5e;
      --text: #e8ecf8;
      --muted: #9aa4c7;
      --accent: #6c8cff;
      --accent2: #4cd8b3;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    header h1 { font-size: 20px; margin: 0; }
    header .notice { font-size: 12px; color: var(--muted); }
    .container {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 16px;
      padding: 16px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 860px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 { font-size: 15px; margin: 0 0 12px; color: var(--accent); }
    /* 요약 */
    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat { background: var(--panel2); border-radius: 8px; padding: 10px; }
    .stat .label { font-size: 11px; color: var(--muted); }
    .stat .value { font-size: 16px; font-weight: 600; margin-top: 2px; }
    /* 채팅 */
    #chat-box {
      height: 320px; overflow-y: auto; background: var(--panel2);
      border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 14px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
    .msg.assistant { align-self: flex-start; background: #2c355a; }
    .msg.loading { align-self: flex-start; color: var(--muted); font-style: italic; }
    .chat-input { display: flex; gap: 8px; margin-top: 10px; }
    .chat-input input { flex: 1; }
    input, button, textarea {
      font-family: inherit; font-size: 14px; border-radius: 8px;
      border: 1px solid var(--line); padding: 9px 11px;
      background: var(--panel2); color: var(--text);
    }
    input:focus, textarea:focus { outline: 1px solid var(--accent); }
    button {
      background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    button.ghost { background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; font-size: 12px; }
    /* 데이터 관리 */
    .form-row { display: grid; grid-template-columns: 1.1fr 0.9fr 1.4fr auto; gap: 6px; margin-bottom: 10px; }
    @media (max-width: 520px) { .form-row { grid-template-columns: 1fr 1fr; } }
    .data-list, .conv-list { max-height: 240px; overflow-y: auto; }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 13px;
    }
    .row .meta { color: var(--muted); font-size: 11px; }
    .conv-item {
      padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
      margin-bottom: 6px; cursor: pointer; font-size: 13px;
    }
    .conv-item:hover { border-color: var(--accent); }
    .conv-item .date { color: var(--muted); font-size: 11px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>📊 내 데이터를 아는 AI 비서</h1>
    <div class="notice">※ 서버가 잠들어 있으면 첫 응답이 30초~1분 걸릴 수 있어요 (무료 서버).</div>
  </header>

  <div class="container">
    <!-- 왼쪽: 요약 + 데이터 관리 -->
    <div>
      <div class="panel">
        <h2>📈 데이터 요약</h2>
        <div class="summary-grid" id="summary">
          <div class="stat"><div class="label">불러오는 중...</div></div>
        </div>
      </div>

      <div class="panel">
        <h2>🗂️ 데이터 관리</h2>
        <div class="form-row">
          <input type="date" id="d-date" />
          <input type="number" id="d-value" placeholder="값" step="0.01" />
          <input type="text" id="d-memo" placeholder="메모" />
          <button onclick="addData()">추가</button>
        </div>
        <div class="data-list" id="data-list"></div>
        <div class="hint">최근 데이터 20개만 표시됩니다. 삭제 버튼으로 개별 삭제 가능.</div>
      </div>
    </div>

    <!-- 오른쪽: 채팅 + 대화기록 -->
    <div>
      <div class="panel">
        <h2>💬 AI 채팅</h2>
        <div id="chat-box"></div>
        <div class="chat-input">
          <input type="text" id="chat-input" placeholder="예: 최근 주가 흐름이 어때?" onkeydown="if(event.key==='Enter')sendChat()" />
          <button onclick="sendChat()">전송</button>
          <button class="ghost" onclick="newChat()">새 대화</button>
        </div>
      </div>

      <div class="panel">
        <h2>🕘 대화 기록</h2>
        <div class="conv-list" id="conv-list"></div>
        <div class="hint">대화를 클릭하면 위 채팅창에 다시 불러옵니다.</div>
      </div>
    </div>
  </div>

  <script>
    // ====== 설정: 배포된 백엔드 주소 ======
    const API_BASE_URL = "https://data-ai-assistant.onrender.com";

    let history = [];  // 현재 대화의 메시지 목록 (AI 문맥 유지용)

    // ====== 데이터 요약 ======
    async function loadSummary() {
      const box = document.getElementById("summary");
      try {
        const res = await fetch(`${API_BASE_URL}/api/data/summary`);
        const s = await res.json();
        const m = s.metrics || {};
        box.innerHTML = `
          <div class="stat"><div class="label">기간</div><div class="value">${s.period || "-"}</div></div>
          <div class="stat"><div class="label">데이터 개수</div><div class="value">${s.count ?? "-"}개</div></div>
          <div class="stat"><div class="label">평균 / 최신</div><div class="value">${m.average ?? "-"} / ${m.latest ?? "-"}</div></div>
          <div class="stat"><div class="label">최고 / 최저</div><div class="value">${m.max ?? "-"} / ${m.min ?? "-"}</div></div>
          <div class="stat" style="grid-column:1/-1"><div class="label">최근 추세</div><div class="value">${s.trend || "-"}</div></div>
        `;
      } catch (e) {
        box.innerHTML = `<div class="stat"><div class="label">요약을 불러오지 못했습니다</div></div>`;
      }
    }

    // ====== 데이터 목록 ======
    async function loadData() {
      const list = document.getElementById("data-list");
      try {
        const res = await fetch(`${API_BASE_URL}/api/data`);
        const data = await res.json();
        const recent = data.slice(-20).reverse();
        list.innerHTML = recent.map(d => `
          <div class="row">
            <div><b>${d.date}</b> — ${d.value}<div class="meta">${d.memo || ""}</div></div>
            <button class="danger" onclick="deleteData('${d.id}')">삭제</button>
          </div>
        `).join("") || "<div class='hint'>데이터가 없습니다.</div>";
      } catch (e) {
        list.innerHTML = "<div class='hint'>데이터를 불러오지 못했습니다.</div>";
      }
    }

    async function addData() {
      const date = document.getElementById("d-date").value;
      const value = parseFloat(document.getElementById("d-value").value);
      const memo = document.getElementById("d-memo").value;
      if (!date || isNaN(value)) { alert("날짜와 값을 입력하세요."); return; }
      await fetch(`${API_BASE_URL}/api/data`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date, value, memo }),
      });
      document.getElementById("d-value").value = "";
      document.getElementById("d-memo").value = "";
      await loadData();
      await loadSummary();
    }

    async function deleteData(id) {
      if (!confirm("이 데이터를 삭제할까요?")) return;
      await fetch(`${API_BASE_URL}/api/data/${id}`, { method: "DELETE" });
      await loadData();
      await loadSummary();
    }

    // ====== 채팅 ======
    function addMsg(role, content) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function sendChat() {
      const input = document.getElementById("chat-input");
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      addMsg("user", message);

      const loading = addMsg("loading", "AI가 답변을 작성 중이에요...");
      try {
        const res = await fetch(`${API_BASE_URL}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await res.json();
        loading.remove();
        const answer = data.answer || "(빈 응답)";
        addMsg("assistant", answer);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: answer });
        loadConversations();
      } catch (e) {
        loading.remove();
        addMsg("assistant", "오류가 발생했어요. 잠시 후 다시 시도해주세요.");
      }
    }

    function newChat() {
      history = [];
      document.getElementById("chat-box").innerHTML = "";
    }

    // ====== 대화 기록 ======
    async function loadConversations() {
      const list = document.getElementById("conv-list");
      try {
        const res = await fetch(`${API_BASE_URL}/api/conversations`);
        const convs = await res.json();
        list.innerHTML = convs.slice(0, 15).map(c => `
          <div class="conv-item" onclick="loadConversation('${c.id}')">
            <div>${c.title || "제목 없음"}</div>
            <div class="date">${(c.created_at || "").slice(0, 16).replace("T", " ")}</div>
          </div>
        `).join("") || "<div class='hint'>저장된 대화가 없습니다.</div>";
      } catch (e) {
        list.innerHTML = "<div class='hint'>대화 기록을 불러오지 못했습니다.</div>";
      }
    }

    async function loadConversation(id) {
      const res = await fetch(`${API_BASE_URL}/api/conversations/${id}`);
      const conv = await res.json();
      const box = document.getElementById("chat-box");
      box.innerHTML = "";
      history = [];
      (conv.messages || []).forEach(m => {
        addMsg(m.role, m.content);
        history.push({ role: m.role, content: m.content });
      });
    }

    // ====== 초기 로드 ======
    loadSummary();
    loadData();
    loadConversations();
  </script>
</body>
</html>
